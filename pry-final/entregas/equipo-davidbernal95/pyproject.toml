[project]
name = "minimercado-analitico"
version = "0.1.0"
description = "Pipeline reproducible de compras, ventas e inventario"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster==1.13.25",
    "dagster-webserver==1.13.25",
    "dbt-core==1.12.5",
    "dbt-duckdb==1.11.0",
    "dlt[duckdb]==1.30.0",
    "duckdb==1.5.6",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_pipeline.py"]
